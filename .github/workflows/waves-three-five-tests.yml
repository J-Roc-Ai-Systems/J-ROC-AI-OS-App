name: Wave Three to Five Platform Tests

on:
  push:
    branches:
      - wave-2-intelligence-production
  pull_request:
    branches:
      - main
      - wave-2-intelligence-production

permissions:
  contents: read

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install platform dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/env-agent/requirements.txt
      - name: Run complete Python test suite
        env:
          JROCAI_GATEWAY_TOKEN: test-gateway-token-for-ci-only
          JROCAI_ALLOW_PAID_CLOUD: "false"
          JROCAI_MONTHLY_SPENDING_LIMIT_USD: "0"
          JROCAI_PLATFORM_DATABASE: /tmp/jrocai-ci-platform.sqlite3
        run: python -m unittest discover -s tests -v
