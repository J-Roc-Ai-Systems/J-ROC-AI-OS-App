name: Wave Three to Five Platform Tests

on:
  push:
    branches:
      - wave-2-intelligence-production
  pull_request:
    branches:
      - main

jobs:
  python-platform-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend requirements
        run: python -m pip install -r backend/env-agent/requirements.txt
      - name: Run repository regression tests
        run: python -m unittest discover -s tests -v
