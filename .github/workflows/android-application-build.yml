name: Android Application Build

on:
  push:
    branches:
      - waves-6-to-10-platform-expansion
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug application
        run: gradle --no-daemon :app:assembleDebug
